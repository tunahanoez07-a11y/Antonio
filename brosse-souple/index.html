<!doctype html>
<html
  lang="fr"
  data-composition-variables='[{"id":"label","type":"string","label":"Label en haut","default":"vrai ou faux ?"},{"id":"accent","type":"color","label":"Couleur d’accent","default":"#6ee7c5"}]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      :root {
        --ground: #0f2a3a;
        --ground-2: #143a4f;
        --ink: #ffffff;
        --accent: #6ee7c5;
        --font-display: "Nunito", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px; height: 1920px; overflow: hidden;
        background: var(--ground);
      }
      #root { width: 100%; height: 100%; font-family: var(--font-display); }
      #bg {
        position: absolute; inset: 0;
        background: radial-gradient(circle at 50% 36%, var(--ground-2) 0%, var(--ground) 62%);
      }
      #label {
        position: absolute; top: 196px; left: 0; right: 0; text-align: center;
        font-family: var(--font-display); font-weight: 800; font-size: 34px;
        letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent);
      }
      #label span {
        display: inline-block; padding: 10px 26px; border-radius: 999px;
        border: 3px solid var(--accent);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="28" data-width="1080" data-height="1920">
      <div id="bg"></div>

      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html"
        data-start="0" data-duration="2.65" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="plaque" data-composition-id="plaque" data-composition-src="compositions/plaque.html"
        data-start="2.65" data-duration="5.02" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="email" data-composition-id="email" data-composition-src="compositions/email.html"
        data-start="7.67" data-duration="5.73" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="tartre" data-composition-id="tartre" data-composition-src="compositions/tartre.html"
        data-start="13.4" data-duration="4.05" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="temps" data-composition-id="temps" data-composition-src="compositions/temps.html"
        data-start="17.45" data-duration="6.68" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="fin" data-composition-id="fin" data-composition-src="compositions/fin.html"
        data-start="24.13" data-duration="3.87" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>

      <div id="label" class="clip" data-start="0" data-duration="28" data-track-index="2"><span data-var-text="label">vrai ou faux ?</span></div>

      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html"
        data-start="0" data-duration="28" data-track-index="3" data-track-kind="captions"
        data-width="1080" data-height="1920"></div>

      <audio id="voix" src="assets/voix.mp3" data-start="0.2" data-track-index="4" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
