    (() => {

const RIG = {"torso": [0, 0], "head": [0, -100], "ua_l": [-25, -86], "la_l": [0, 44], "ua_r": [25, -86], "la_r": [0, 44], "ul_l": [-12, 0], "ll_l": [0, 55], "ul_r": [12, 0], "ll_r": [0, 55]}, PELVIS_Y = -110, MOUTHS = {"smile": "M-11,-24 Q0,-15 11,-24", "grin": "M-14,-26 Q0,-6 14,-26", "flat": "M-8,-21 Q0,-21 8,-21", "frown": "M-10,-17 Q0,-27 10,-17", "open": "M-7,-22 Q0,-8 7,-22", "shout": "M-10,-24 Q0,-2 10,-24"}, BROWS = {"none": "M-16,-53 L-6,-53 M6,-53 L16,-53", "angry": "M-17,-57 L-5,-50 M5,-50 L17,-57", "sad": "M-17,-50 L-5,-56 M5,-56 L17,-50", "up": "M-17,-56 L-5,-58 M5,-58 L17,-56"};
const tl = gsap.timeline({ paused: true });
function jointT(k, v) {
  if (k === "pelvis") { const d = Array.isArray(v) ? v : [v, 0]; return `translate(0,${PELVIS_Y + d[0]}) rotate(${d[1]})`; }
  const b = RIG[k]; return `translate(${b[0]},${b[1]}) rotate(${v})`;
}
function P(id, pose, t, d = 0.35, ease = "power2.inOut") {
  for (const k in pose) {
    const v = pose[k]; let sel = `#${id}-${k}`, vars;
    if (k === "root") { sel = `#${id}`; vars = { attr: { transform: `translate(${v[0]},${v[1]}) rotate(${v[2] || 0}) scale(${v[3] || 1})` } }; }
    else if (k === "mouth") vars = { attr: { d: MOUTHS[v] } };
    else if (k === "brow") vars = { attr: { d: BROWS[v] }, opacity: v === "none" ? 0 : 1 };
    else if (k === "eyes") vars = { attr: { transform: `translate(0,-40) scale(1,${v})` } };
    else { vars = { attr: { transform: jointT(k, v) } }; if (k === "torso") sel = `#${id}-torso, #${id}-torsob`; }
    if (d === 0) tl.set(sel, vars, t); else tl.to(sel, { ...vars, duration: d, ease }, t);
  }
}
function blink(id, t) { P(id, { eyes: 0.1 }, t, 0.06, "none"); P(id, { eyes: 1 }, t + 0.09, 0.08, "none"); }
function T(sel, t, vars, d = 0.35, ease = "power2.inOut") {
  if (d === 0) tl.set(sel, vars, t); else tl.to(sel, { ...vars, duration: d, ease }, t);
}
// hard cut between shots inside a scene
function cut(hideSel, showSel, t) { if (hideSel) tl.set(hideSel, { opacity: 0 }, t); if (showSel) tl.set(showSel, { opacity: 1 }, t); }
// walk/run cycle from (x0) to (x1) between t0 and t1; s = figure scale
function walk(id, x0, x1, y, s, t0, t1, step = 0.32, amp = 26, lean = 4) {
  T(`#${id}`, t0, { attr: { transform: `translate(${x0},${y}) rotate(0) scale(${s})` } }, 0);
  tl.to(`#${id}`, { attr: { transform: `translate(${x1},${y}) rotate(0) scale(${s})` }, duration: t1 - t0, ease: "none" }, t0);
  P(id, { torso: lean }, t0, 0.2);
  let k = 0;
  for (let t = t0; t < t1 - 0.01; t += step, k++) {
    const a = k % 2 ? amp : -amp, d = Math.min(step, t1 - t);
    P(id, { ul_l: a, ll_l: a > 0 ? 0 : -amp * 0.9, ul_r: -a, ll_r: -a > 0 ? 0 : -amp * 0.9,
            ua_l: -a * 0.8, la_l: -10, ua_r: a * 0.8, la_r: -10, pelvis: [k % 2 ? -4 : 0, 0] }, t, d, "sine.inOut");
  }
}


// cape + wind
for (let k = 0; k < 6; k++) T("#s02-cape", k * 0.5, {attr: {d: k % 2 ? "M-24,-96 Q-62,0 -70,92 L40,96 Q30,0 24,-96 Z" : "M-24,-96 Q-90,-10 -118,70 L20,96 Q30,0 24,-96 Z"}}, 0.5, "sine.inOut");
for (let i = 0; i < 3; i++) tl.fromTo(`#s02-wind${i}`, {opacity: 0, x: -120}, {opacity: 0.8, x: 160, duration: 1.4, ease: "none"}, 0.2 + i * 0.6);
P("s02-h", {head: 6}, 0.9, 0.6); blink("s02-h", 1.8); P("s02-h", {torso: -3}, 2.0, 0.6);
cut("#s02-a", "#s02-b", 3.1);
// energy jumps
T("#s02-aura", 3.1, {opacity: 0.85}, 0.4, "power2.out");
for (let k = 0; k < 4; k++) {
  const t = 3.2 + k * 0.75;
  P("s02-j", {pelvis: [14, 0], ua_l: 40, ua_r: -40}, t, 0.15, "power2.in");
  P("s02-j", {root: [540, 530, 0, 1.7], pelvis: [0, 0], ua_l: 150, la_l: -10, ua_r: -150, la_r: 10, ul_l: 28, ul_r: -28}, t + 0.15, 0.25, "power2.out");
  P("s02-j", {root: [540, 600, 0, 1.7], ua_l: 30, la_l: 20, ua_r: -30, la_r: -20, ul_l: 3, ul_r: -3}, t + 0.42, 0.25, "power2.in");
  T("#s02-aura", t + 0.2, {attr: {r: 330}}, 0.2, "power2.out"); T("#s02-aura", t + 0.45, {attr: {r: 290}}, 0.3);
}
for (let i = 0; i < 14; i++) {
  const a = i / 14 * Math.PI * 2, r = 260 + (i % 4) * 40;
  tl.fromTo(`#s02-p${i}`, {opacity: 0, attr: {cx: 540, cy: 330}}, {opacity: 1, attr: {cx: 540 + Math.cos(a) * r, cy: 330 + Math.sin(a) * r * 0.8}, duration: 1.2, ease: "power2.out"}, 3.3 + (i % 5) * 0.5);
  tl.to(`#s02-p${i}`, {opacity: 0, duration: 0.3}, 4.5 + (i % 5) * 0.5);
}

    window.__timelines["s02"] = tl;
